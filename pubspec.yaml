name: prism_adaptive_scaffold
description: >-
  Responsive adaptive scaffolds for Flutter — the maintained replacement for
  the discontinued flutter_adaptive_scaffold. Navigation rails, split views,
  and breakpoints that adapt from phone to tablet to desktop out of the box.
version: 0.1.0
repository: https://github.com/awaisdev5765/prism_adaptive_scaffold
issue_tracker: https://github.com/awaisdev5765/prism_adaptive_scaffold/issues
topics:
  - adaptive
  - responsive
  - scaffold
  - navigation
  - layout

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
